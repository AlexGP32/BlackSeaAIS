services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blacksea
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blacksea"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:?Set AISSTREAM_API_KEY in a .env file next to docker-compose.yml}
      SUPABASE_CONNECTION_STRING: Host=db;Port=5432;Database=blacksea;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Disable
    restart: unless-stopped

volumes:
  pgdata:

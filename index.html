<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/MarkerCluster.css">
    <link rel="stylesheet" href="css/MarkerCluster.Default.css">
<style>
    html, body {
        margin: 0;
        padding: 0;
    }
    #map {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
    }
</style>
</head>
<body>
    <div id="map"></div>
    <script src="js/leaflet.js"></script>
    <script src="js/leaflet.markercluster.js"></script>
    <script>
        // Force Canvas rendering to support thousands of path points without DOM lag
        var map = L.map('map', { preferCanvas: true }).setView([43.5, 34.5], 6);
        
        // Chunked loading prevents UI freezing when rendering massive clusters
        var markerClusterGroup = L.markerClusterGroup({ chunkedLoading: true });
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        markerClusterGroup.addTo(map);
    </script>
    <script src="js/supabase-js@2.js"></script>
    <script>

        // Retention thresholds
        const SHIP_MAX_AGE_MS = 24 * 60 * 60 * 1000; // Drop ships unseen for 24h
        const SHIP_LIVE_MS = 60 * 60 * 1000;         // Fade out ships unseen for 1h
        const ROUTE_WINDOW_MS = 24 * 60 * 60 * 1000; // Constrain historical routes to 24h
        
        // Pagination limit for trajectory points
        const ROUTE_MAX_POINTS = 1000;

        // Break polylines if time gap exceeds 15m to prevent false land-crossing lines during signal loss
        const ROUTE_MAX_GAP_MS = 15 * 60 * 1000; 

        // Fetches and bulk-renders active ships
        function UpdateShips() {
            const now = Date.now();
            const since = new Date(now - SHIP_MAX_AGE_MS).toISOString();

            supabaseClient.from("ships")
                .select("last_latitude, last_longitude, ship_name, mmsi, true_heading, is_plausible, last_update")
                .gte("last_update", since)
                .then((result) => {
                    if (result.error) {
                        console.error("Error fetching ships:", result.error);
                        return;
                    }
                    
                    markerClusterGroup.clearLayers();
                    const newMarkers = [];

                    result.data.forEach((ship) => {
                        const isLive = (now - new Date(ship.last_update).getTime()) <= SHIP_LIVE_MS;
                        const opacity = isLive ? 1 : 0.35;

                        // Visual flag for anomalous positions bypassing kinematic checks
                        const warningicon = ship.is_plausible ? '' : '<span style="position: absolute; top: -6px; left: -12px; right: -6px; font-size: 15px; pointer-events: none" title="Suspicious position">⚠️</span>';

                        const rotatedIcon = L.divIcon({
                            html: `<div style="position: relative;"> ${warningicon} <img src="pngs/boat.png" style="width: 50px; height: 50px; opacity: ${opacity}; transform: rotate(${ship.true_heading}deg);" /></div>`,
                            iconSize: [50, 50],
                            iconAnchor: [25, 25],
                            className: 'ship-icon'
                        });

                        const marker = L.marker([ship.last_latitude, ship.last_longitude], { icon: rotatedIcon })
                            .bindPopup(`Name: ${ship.ship_name}<br>MMSI: ${ship.mmsi}<br>Heading: ${ship.true_heading}<br>Last seen: ${new Date(ship.last_update).toLocaleString()}<br><button onclick="ShowRoute(${ship.mmsi})">Show route</button>`);
                        
                        newMarkers.push(marker);
                    });

                    // Bulk insert optimizes cluster geometry calculations
                    markerClusterGroup.addLayers(newMarkers);
                });
        }
        
        var currentRoute = null;
        var spoofLayer = L.layerGroup().addTo(map);

        // Draws historical trajectory (blue) and isolated anomalous points (red)
        function ShowRoute(mmsi) {
            if (currentRoute) {
                map.removeLayer(currentRoute);
                currentRoute = null;
            }
            spoofLayer.clearLayers();

            const since = new Date(Date.now() - ROUTE_WINDOW_MS).toISOString();

            supabaseClient.from("position_history")
                .select("latitude, longitude, recorded_time, is_plausible")
                .eq("mmsi", mmsi)
                .gte("recorded_time", since)
                .order("recorded_time", { ascending: false })
                .limit(ROUTE_MAX_POINTS)
                .then(({ data, error }) => {
                    if (error) {
                        console.error("Error fetching route:", error);
                        return;
                    }
                    if (!data || data.length === 0) {
                        alert("No route data for this ship in the last 24 hours.");
                        return;
                    }

                    const allPoints = [];
                    const segments = [];
                    let current = [];
                    let prevTime = null;

                    data.reverse().forEach((p) => {
                        const latlng = [p.latitude, p.longitude];
                        allPoints.push(latlng);

                        // Segregate implausible points from the main trajectory
                        if (!p.is_plausible) {
                            L.circleMarker(latlng, {
                                radius: 7,
                                color: 'red',
                                fillColor: 'red',
                                fillOpacity: 0.7
                            })
                            .bindPopup(`⚠️ Suspicious position<br>${new Date(p.recorded_time).toLocaleString()}`)
                            .addTo(spoofLayer);
                            return;
                        }

                        // Segment break on signal gap
                        const t = new Date(p.recorded_time).getTime();
                        if (prevTime !== null && t - prevTime > ROUTE_MAX_GAP_MS) {
                            segments.push(current);
                            current = [];
                        }
                        current.push(latlng);
                        prevTime = t;
                    });
                    
                    if (current.length > 0) segments.push(current);

                    if (segments.length > 0) {
                        currentRoute = L.polyline(segments, { color: 'blue', weight: 2, opacity: 0.5 }).addTo(map);
                    }

                    // Overlay plausible points
                    data.forEach((p) => {
                        if (p.is_plausible) {
                            L.circleMarker([p.latitude, p.longitude], {
                                radius: 4,
                                color: 'white',
                                weight: 1,
                                fillColor: '#ff8800',
                                fillOpacity: 1
                            })
                            .bindPopup(new Date(p.recorded_time).toLocaleString())
                            .addTo(spoofLayer);
                        }
                    }); 

                    map.fitBounds(L.latLngBounds(allPoints), { padding: [40, 40] });
                });
        }

        // Public anon key (read-only RLS secured)
        const supabaseClient = window.supabase.createClient("https://meelehndrbaqdhmmvtip.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lZWxlaG5kcmJhcWRobW12dGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MjM5ODUsImV4cCI6MjEwNDA5OTk4NX0.vlAMy013lam4PMHO4F0ReGmXO22HPmARDJoQO5u6Mak");
        
        UpdateShips();
        // Increased refresh interval to 15s to prevent UX disruption (popup closures)
        setInterval(UpdateShips, 15000);
    </script>
</body>
</html>

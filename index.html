<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/MarkerCluster.css">
    <link rel="stylesheet" href="css/MarkerCluster.Default.css">
<style>
    html, body {
        margin: 0;
        padding: 0;
    }
    #map {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
    }
</style>
</head>
<body>
    <div id="map"></div>
    <script src="js/leaflet.js"></script>
    <script src="js/leaflet.markercluster.js"></script>
    <script>
        // Centered roughly on the Black Sea, zoom level chosen to show the whole region
        var map = L.map('map').setView([43.5, 34.5], 6);
        var markerClusterGroup = L.markerClusterGroup();
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        markerClusterGroup.addTo(map);
    </script>
    <script src="js/supabase-js@2.js"></script>
    <script>
        // Fetches the latest known position for every ship and redraws all markers.
        // Called on load and re-run every 5 seconds (see setInterval below).
        function UpdateShips() {
            supabaseClient.from("ships").select("last_latitude, last_longitude, ship_name, mmsi, true_heading, is_plausible").then((result) => {
                if (result.error) {
                    console.error("Error fetching ships:", result.error);
                    return;
                }
                // Clear old markers before redrawing, otherwise ships pile up on every refresh
                markerClusterGroup.clearLayers();
                result.data.forEach((ship) => {
                    // Show a warning badge on ships flagged as implausible
                    // (likely GPS spoofing, position landed on shore)
                    const warningicon = ship.is_plausible ? '' : '<span style="position: absolute; top: -6px; left: -12px; right: -6px; font-size: 15px; pointer-events: none" title="Position looks wrong (possibly on land)">⚠️</span>';
                    // Rotate the boat icon to match true_heading so ships point
                    // in their actual direction of travel on the map
                    const rotatedIcon = L.divIcon({
                        html: `<div style="position: relative;"> ${warningicon} <img src="pngs/boat.png" style="width: 50px; height: 50px; transform: rotate(${ship.true_heading}deg);" /></div>`,
                        iconSize: [50, 50],
                        iconAnchor: [25, 25],
                        className: 'ship-icon'
                    });
                    L.marker([ship.last_latitude, ship.last_longitude], { icon: rotatedIcon })
                        .addTo(markerClusterGroup)
                        .bindPopup(`Name: ${ship.ship_name}<br>MMSI: ${ship.mmsi}<br>Heading: ${ship.true_heading}<br><button onclick="ShowRoute(${ship.mmsi})">Show route</button>`);
                });
            });
        }

        // Keeps track of the currently drawn route so it can be removed
        // before drawing a new one (only one route shown on the map at a time)
        var currentRoute = null;
        // Separate layer for spoofed points so they can be cleared independently
        var spoofLayer = L.layerGroup().addTo(map);

        // If two consecutive plausible points are further apart in time than this,
        // the line is broken instead of drawn straight between them. Otherwise a
        // data gap (e.g. backend offline for days or data being received at a later date) would show up as a fake straight
        // line crossing land.
        const MAX_GAP_MS = 15 * 60 * 1000; // 15 minutes

        // Only positions from this time window are shown, so old voyages
        // are not mixed with the current one.
        const ROUTE_WINDOW_MS = 24 * 60 * 60 * 1000; // 24 hours

        // Draws a ship's recent route as a blue polyline (broken at data gaps)
        // and its implausible (spoofed) positions as red dots,
        // then zooms the map to fit everything.
        function ShowRoute(mmsi) {
            // Clear whatever was drawn for the previous ship
            if (currentRoute) {
                map.removeLayer(currentRoute);
                currentRoute = null;
            }
            spoofLayer.clearLayers();

            const since = new Date(Date.now() - ROUTE_WINDOW_MS).toISOString();

            // One query for all positions in the time window, plausible or not.
            // Newest first so LIMIT keeps the most recent points.
            supabaseClient.from("position_history")
                .select("latitude, longitude, recorded_time, is_plausible")
                .eq("mmsi", mmsi)
                .gte("recorded_time", since)
                .order("recorded_time", { ascending: false })
                .limit(1000)
                .then(({ data, error }) => {
                    if (error) {
                        console.error("Error fetching route:", error);
                        return;
                    }
                    if (!data || data.length === 0) {
                        alert("No route data for this ship in the last 24 hours.");
                        return;
                    }

                    const allPoints = [];
                    const segments = [];   // list of continuous route pieces
                    let current = [];      // piece being built
                    let prevTime = null;   // time of the previous plausible point

                    // Reverse to chronological order (oldest first) for drawing
                    data.reverse().forEach((p) => {
                        const latlng = [p.latitude, p.longitude];
                        allPoints.push(latlng);

                        // Implausible positions are shown as red dots and kept out of the line
                        if (!p.is_plausible) {
                            L.circleMarker(latlng, {
                                radius: 7,
                                color: 'red',
                                fillColor: 'red',
                                fillOpacity: 0.7
                            })
                            .bindPopup(`⚠️ Suspicious position<br>${new Date(p.recorded_time).toLocaleString()}`)
                            .addTo(spoofLayer);
                            return;
                        }

                        // Start a new line segment when there is a gap in the data
                        const t = new Date(p.recorded_time).getTime();
                        if (prevTime !== null && t - prevTime > MAX_GAP_MS) {
                            segments.push(current);
                            current = [];
                        }
                        current.push(latlng);
                        prevTime = t;
                    });
                    if (current.length > 0) segments.push(current);

                    // Leaflet draws an array of arrays as separate line pieces (multi-polyline)
                    if (segments.length > 0) {
                        currentRoute = L.polyline(segments, { color: 'blue' }).addTo(map);
                    }

                    // Zoom so the route and the suspicious points are all visible
                    map.fitBounds(L.latLngBounds(allPoints), { padding: [40, 40] });
                });
        }

        // Public anon key: safe to expose client-side, access is restricted
        // by Supabase Row Level Security (RLS) policies on the "ships" and
        // "position_history" tables (read-only SELECT, as set up in the README)
        const supabaseClient = window.supabase.createClient("https://meelehndrbaqdhmmvtip.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lZWxlaG5kcmJhcWRobW12dGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MjM5ODUsImV4cCI6MjEwNDA5OTk4NX0.vlAMy013lam4PMHO4F0ReGmXO22HPmARDJoQO5u6Mak");
        UpdateShips();
        setInterval(UpdateShips, 5000);
    </script>
</body>
</html>
